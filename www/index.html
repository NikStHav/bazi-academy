<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2e2e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>BaZi Academy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">BaZi Academy</h1>
    <span class="logo" aria-hidden="true">八字</span>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <a href="#/learn" data-tab="learn"><span class="ti">学</span><span>Learn</span></a>
    <a href="#/chart" data-tab="chart"><span class="ti">命</span><span>Chart</span></a>
    <a href="#/quiz" data-tab="quiz"><span class="ti">考</span><span>Quiz</span></a>
    <a href="#/today" data-tab="today"><span class="ti">今</span><span>Today</span></a>
  </nav>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet">
      <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
