name: BaZi Academy (Website)

# Publishes docs/ (support, privacy, Impressum, calendar feeds) and the web app (/app/) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions". Then run this workflow (Actions → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Release check (Impressum address and email)
        run: node tools/check-release.cjs
      - name: Build website
        run: node tools/build-web.cjs dist/site ${{ github.run_number }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
